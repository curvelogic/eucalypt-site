name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor eucalypt
        uses: ./.github/actions/vendor-eucalypt
        with:
          fixtures: "true"

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Browser tests
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run e2e -- --screenshots e2e-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
