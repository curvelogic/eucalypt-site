name: Deploy to GitHub Pages

# Paused: the site is built for the root of eucalypt.curvelogic.info, and
# would not work at the current project URL (/eucalypt-playground/). The
# deployment change, which the owner merges, sets the custom domain and turns
# deploys on push back on. Until then the playground already deployed stays
# as it is. Do not run this by hand before that change is merged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor eucalypt
        uses: ./.github/actions/vendor-eucalypt

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
