name: Deploy

# Builds the site and deploys it to Cloudflare as a Worker with static assets
# (wrangler.jsonc), served at eucalypt.curvelogic.info. Only the deploy job
# sees the Cloudflare secrets; the build, which runs the repository's own
# scripts and dependencies, does not.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor eucalypt
        uses: ./.github/actions/vendor-eucalypt

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://eucalypt.curvelogic.info/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install wrangler
        run: npm ci --ignore-scripts

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
