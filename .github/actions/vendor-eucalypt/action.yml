name: Vendor eucalypt
description: >
  Build the engine and take the grammar and highlighting stylesheet from the
  eucalypt revision pinned in eucalypt-pin.json (scripts/vendor-eucalypt.sh).
inputs:
  fixtures:
    description: Also render the examples/aoc25 fixtures the tests compare against
    default: "false"
runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
        rustup default stable
    - name: wasm-pack
      shell: bash
      run: |
        tarball="$RUNNER_TEMP/wasm-pack.tar.gz"
        curl -sSfL -o "$tarball" https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
        echo "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539  $tarball" | sha256sum -c -
        tar xzf "$tarball" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/wasm-pack-v0.13.1-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
    - name: Cache eucalypt build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          .eucalypt/target
        key: eucalypt-${{ runner.os }}-${{ hashFiles('eucalypt-pin.json') }}
        restore-keys: eucalypt-${{ runner.os }}-
    - name: Vendor
      shell: bash
      run: scripts/vendor-eucalypt.sh ${{ inputs.fixtures == 'true' && '--fixtures' || '' }}
